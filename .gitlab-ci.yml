workflow:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

stages:
  - test
  - build
  - e2e
  - publish

default:
  interruptible: true

variables:
  CGO_ENABLED: "0"
  GOTOOLCHAIN: "local"
  GOCACHE: "$CI_PROJECT_DIR/.cache/go-build"
  GOMODCACHE: "$CI_PROJECT_DIR/.cache/go-mod"

.go_job:
  image: golang:1.26.4-alpine3.23@sha256:18b460dd17542c2ba43299a633cf6ebfc1115101509531471d7cfce1019af083
  cache:
    key:
      files:
        - go.sum
    paths:
      - .cache/go-build/
      - .cache/go-mod/

test:
  extends: .go_job
  stage: test
  script:
    - go mod tidy -diff
    - go vet ./...
    - go test ./...

build_binaries:
  extends: .go_job
  stage: build
  needs:
    - test
  script:
    - mkdir -p dist
    - VERSION="${CI_COMMIT_TAG:-0.0.1-${CI_COMMIT_SHORT_SHA}}"
    - VERSION="${VERSION#v}"
    - LDFLAGS="-s -w -X gitlab.com/1001n/kapellmeister/buildinfo.Version=${VERSION} -X gitlab.com/1001n/kapellmeister/buildinfo.Commit=${CI_COMMIT_SHA}"
    - GOOS=linux GOARCH=amd64 go build -buildvcs=false -mod=readonly -trimpath -ldflags "$LDFLAGS" -o dist/kapellmeister-linux-amd64 .
    - GOOS=windows GOARCH=amd64 go build -buildvcs=false -mod=readonly -trimpath -ldflags "$LDFLAGS" -o dist/kapellmeister-windows-amd64.exe .
    - (cd dist && sha256sum kapellmeister-linux-amd64 > kapellmeister-linux-amd64.sha256)
    - (cd dist && sha256sum kapellmeister-windows-amd64.exe > kapellmeister-windows-amd64.exe.sha256)
    - ./dist/kapellmeister-linux-amd64 version
  artifacts:
    name: "kapellmeister-${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA}"
    paths:
      - dist/kapellmeister-linux-amd64
      - dist/kapellmeister-linux-amd64.sha256
      - dist/kapellmeister-windows-amd64.exe
      - dist/kapellmeister-windows-amd64.exe.sha256
    expire_in: 30 days

e2e:
  stage: e2e
  image: docker:29.8.2-cli
  tags:
    - saas-linux-small-amd64
  services:
    - name: docker:29.8.2-dind
      alias: docker
      variables:
        HEALTHCHECK_TCP_PORT: "2376"
  needs:
    - build_binaries
  allow_failure: true
  timeout: 30m
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
    KIND_VERSION: v0.33.0
    KUBECTL_VERSION: v1.37.0
    KIND_NODE_IMAGE: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
  before_script:
    - apk add --no-cache bash curl
    - curl -fsSL --retry 3 "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64" -o /usr/local/bin/kind
    - curl -fsSL --retry 3 "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl" -o /usr/local/bin/kubectl
    - chmod +x /usr/local/bin/kind /usr/local/bin/kubectl
    - docker info
  script:
    - |
      set -eu
      git clone --depth 1 https://gitlab.com/1001n/kapellmeister-e2e-tests.git e2e-tests
      mkdir -p e2e-tests/.work
      export KAPELLMEISTER="$CI_PROJECT_DIR/dist/kapellmeister-linux-amd64"
      export KUBECONFIG="$CI_PROJECT_DIR/e2e-tests/.work/admin.kubeconfig"
      chmod +x "$KAPELLMEISTER"

      dind_ip=$(getent hosts docker | awk 'NR == 1 {print $1}')
      test -n "$dind_ip"
      cat > e2e-tests/.work/kind.yaml <<EOF
      kind: Cluster
      apiVersion: kind.x-k8s.io/v1alpha4
      networking:
        apiServerAddress: "$dind_ip"
        apiServerPort: 6443
      EOF

      kind create cluster --name "kapellmeister-e2e" \
        --image "$KIND_NODE_IMAGE" --config e2e-tests/.work/kind.yaml \
        --kubeconfig "$KUBECONFIG" --wait 180s
      bash e2e-tests/scripts/run.sh
  artifacts:
    when: always
    paths:
      - e2e-tests/.work/*.log
    expire_in: 7 days
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
    - if: '$CI_COMMIT_BRANCH'
      when: manual
      allow_failure: true

publish_container:
  stage: publish
  interruptible: false
  image:
    name: moby/buildkit:rootless@sha256:80b15f0735e87bab7bf59ec4d695dfb4a7cfb25521cf56dc75d6f256285b63ef
    entrypoint: [""]
  variables:
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
  needs:
    - job: build_binaries
      artifacts: true
  before_script:
    - mkdir -p "$HOME/.docker"
    - printf '{"auths":{"%s":{"username":"%s","password":"%s"}}}' "$CI_REGISTRY" "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" > "$HOME/.docker/config.json"
  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        IMAGE_TAG="${CI_COMMIT_TAG#v}"
      else
        IMAGE_TAG="latest"
      fi

      buildctl-daemonless.sh build \
        --frontend dockerfile.v0 \
        --local context=. \
        --local dockerfile=. \
        --opt platform=linux/amd64 \
        --opt "build-arg:SOURCE=${CI_PROJECT_URL}" \
        --opt "build-arg:REVISION=${CI_COMMIT_SHA}" \
        --output "type=image,name=${CI_REGISTRY_IMAGE}:${IMAGE_TAG},push=true"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

publish_release:
  stage: publish
  interruptible: false
  variables:
    GLAB_ENABLE_CI_AUTOLOGIN: "true"
  image:
    name: registry.gitlab.com/gitlab-org/cli:latest@sha256:79223ad3fa6e3c3226119ac5d0b73e55f1b909e6d5bbf8469726480723b63ba8
    entrypoint: [""]
  needs:
    - job: build_binaries
      artifacts: true
  script:
    - test -x dist/kapellmeister-linux-amd64
    - test -f dist/kapellmeister-windows-amd64.exe
    - test -f dist/kapellmeister-linux-amd64.sha256
    - test -f dist/kapellmeister-windows-amd64.exe.sha256
    - |
      glab release create "$CI_COMMIT_TAG" \
        --ref "$CI_COMMIT_SHA" \
        --name "Kapellmeister $CI_COMMIT_TAG" \
        --notes "Kapellmeister $CI_COMMIT_TAG" \
        --use-package-registry \
        --package-name kapellmeister \
        "dist/kapellmeister-linux-amd64#Linux x86_64#package" \
        "dist/kapellmeister-linux-amd64.sha256#Linux x86_64 SHA-256#package" \
        "dist/kapellmeister-windows-amd64.exe#Windows x86_64#package" \
        "dist/kapellmeister-windows-amd64.exe.sha256#Windows x86_64 SHA-256#package"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
