workflow:
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

stages:
  - test
  - build
  - publish

default:
  interruptible: true

variables:
  CGO_ENABLED: "0"
  GOTOOLCHAIN: "local"
  GOCACHE: "$CI_PROJECT_DIR/.cache/go-build"
  GOMODCACHE: "$CI_PROJECT_DIR/.cache/go-mod"

.go_job:
  image: golang:1.26.4-alpine3.23
  cache:
    key:
      files:
        - go.sum
    paths:
      - .cache/go-build/
      - .cache/go-mod/

test:
  extends: .go_job
  stage: test
  script:
    - go test ./...

build_binaries:
  extends: .go_job
  stage: build
  needs:
    - test
  script:
    - mkdir -p dist
    - VERSION="${CI_COMMIT_TAG:-0.0.1-${CI_COMMIT_SHORT_SHA}}"
    - VERSION="${VERSION#v}"
    - LDFLAGS="-s -w -X gitlab.com/1001n/kapellmeister/buildinfo.Version=${VERSION} -X gitlab.com/1001n/kapellmeister/buildinfo.Commit=${CI_COMMIT_SHA}"
    - GOOS=linux GOARCH=amd64 go build -buildvcs=false -mod=readonly -trimpath -ldflags "$LDFLAGS" -o dist/kapellmeister .
    - GOOS=windows GOARCH=amd64 go build -buildvcs=false -mod=readonly -trimpath -ldflags "$LDFLAGS" -o dist/kapellmeister.exe .
    - ./dist/kapellmeister version
  artifacts:
    name: "kapellmeister-${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA}"
    paths:
      - dist/kapellmeister
      - dist/kapellmeister.exe
    expire_in: 30 days

publish_container:
  stage: publish
  image:
    # Rootless BuildKit pinned by digest for reproducible builds.
    name: moby/buildkit:rootless@sha256:80b15f0735e87bab7bf59ec4d695dfb4a7cfb25521cf56dc75d6f256285b63ef
    entrypoint: [""]
  variables:
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
  needs:
    - job: build_binaries
      artifacts: true
  before_script:
    - mkdir -p "$HOME/.docker"
    - printf '{"auths":{"%s":{"username":"%s","password":"%s"}}}' "$CI_REGISTRY" "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" > "$HOME/.docker/config.json"
  script:
    - IMAGE_TAG="${CI_COMMIT_TAG:-latest}"
    - buildctl-daemonless.sh build --frontend dockerfile.v0 --local context=. --local dockerfile=. --opt "build-arg:SOURCE=${CI_PROJECT_URL}" --opt "build-arg:REVISION=${CI_COMMIT_SHA}" --output "type=image,name=${CI_REGISTRY_IMAGE}:${IMAGE_TAG},push=true"
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
